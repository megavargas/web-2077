faq:
  - q: ¿En qué se diferencia del diagnóstico de 2–4 semanas?
    a: El diagnóstico es el punto de partida rápido e incluye una lectura de madurez para priorizar casos de uso. La evaluación de madurez profundiza con evidencias técnicas y deja una línea base formal, útil para un plan director, una auditoría interna o una conversación con el supervisor.
  - q: ¿Nos compararéis con otras empresas del sector?
    a: No damos rankings frente a competidores sin datos que los sostengan. Comparamos tu situación con lo que exigen tus objetivos y la regulación de tu sector, que es lo que sirve para decidir.
  - q: ¿Cuánto esfuerzo pide a nuestros equipos?
    a: Entrevistas y talleres puntuales con responsables de negocio, datos y tecnología, y acceso de lectura a documentación y plataforma. Cualquier acceso a datos se acuerda antes con tus equipos de seguridad.
cta:
  title: ¿Necesitas una foto fiable de tu punto de partida?
  text: Empieza por un diagnóstico de 2–4 semanas y decide después si necesitas una evaluación completa con línea base.
  button: Solicita un diagnóstico
