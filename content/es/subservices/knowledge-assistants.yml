faq:
  - q: ¿Cómo se evita que el asistente invente respuestas?
    a: Las respuestas se basan solo en tus fuentes, citan el documento de origen y el asistente dice cuándo no tiene información suficiente. Medimos la calidad con preguntas reales antes de salir y después en producción.
  - q: ¿Qué pasa con la información confidencial?
    a: El asistente respeta los permisos de los sistemas de origen, los datos se quedan en tu entorno cloud y cada consulta queda registrada. Lo diseñamos con seguridad y protección de datos desde el principio.
  - q: ¿Por dónde empezamos?
    a: Por un área con muchas consultas repetidas y documentación razonablemente ordenada, como atención al cliente o un equipo de operaciones. El diagnóstico identifica cuál y qué hay que ordenar antes.
cta:
  title: ¿Qué preguntas se repiten en tu organización?
  text: En un diagnóstico de 2–4 semanas identificamos el área con más retorno, el estado de sus fuentes y el plan para llevar el asistente a producción.
  button: Solicita un diagnóstico
