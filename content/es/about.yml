seo:
  title: Nosotros — Consultora de datos e IA desde 2016
  description: Contextual Intelligence Partners es una consultora de estrategia, datos e IA, fundada en Madrid en 2016, con foco en Telco, Banca y Seguros.
header:
  eyebrow: Nosotros
  title: Consultora de estrategia, datos e IA
  intro: Desde 2016 ayudamos a empresas de Telco, Banca y Seguros a tomar mejores decisiones con datos.
story:
  title: Nuestra historia
  paragraphs:
    - Contextual nació en Madrid en 2016 como consultora de business intelligence y datos. Desde entonces hemos acompañado a operadores de telecomunicaciones, entidades financieras y otras grandes organizaciones en la construcción de sus plataformas de datos y analítica.
    - Hoy unimos consultoría, datos, inteligencia e IA en un mismo recorrido, con foco en sectores regulados, donde el contexto lo es todo.
principles:
  title: Cómo somos
  items:
    - name: Tecnología al servicio del problema
      text: Elegimos la tecnología por el problema, no por el fabricante.
    - name: Orientados a producción
      text: Medimos el éxito por lo que llega a producción y se usa, no por los pilotos.
    - name: Transferimos el conocimiento
      text: Trabajamos con tus equipos para que no dependan de nosotros.
