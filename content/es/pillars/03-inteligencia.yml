key: intelligence
order: 3
number: '03'
slug: inteligencia
name: Inteligencia
subtitle: BI, analítica y decision intelligence
benefit: Decisiones basadas en evidencia, en el momento en que se toman.
summary: Analítica que llega a quien decide, en el momento en que decide, y recomienda el siguiente paso.
seo:
  title: BI, analítica avanzada y decision intelligence
  description: BI y capa semántica, analítica avanzada, modelos predictivos, decision intelligence y analítica de autoservicio.
problem:
  title: El problema
  text: Cuadros de mando que nadie mira, métricas que cada área define a su manera y análisis que llegan cuando la decisión ya está tomada.
includes:
  title: Qué incluye
  items:
    - name: BI y capa semántica
      text: Definiciones únicas de las métricas, reutilizables en todos los informes y herramientas.
    - name: Analítica avanzada
      text: Segmentación, atribución y análisis de causas para entender qué está pasando y por qué.
    - name: Modelos predictivos
      text: Previsión de demanda, abandono, riesgo o fraude, integrada en los procesos.
    - name: Decision intelligence
      text: Cuadros de mando que recomiendan la siguiente acción, no solo muestran el dato.
    - name: Analítica de autoservicio
      text: Herramientas y formación para que cada área responda sus propias preguntas con datos fiables.
outcome:
  title: Resultado
  text: Métricas comunes, análisis a tiempo y modelos que se usan en la operación diaria.
technologies:
  - Power BI
  - Looker Studio
  - BigQuery
  - Python
faq:
  - q: ¿Hay que cambiar nuestra herramienta de BI?
    a: Solo si aporta valor. A menudo el problema no es la herramienta, sino las definiciones y el modelo de datos que hay detrás.
  - q: ¿Qué es decision intelligence?
    a: Llevar el análisis al punto de decisión. El cuadro de mando sugiere la acción (a quién retener, qué oferta presentar, qué riesgo revisar) y mide el resultado.
cta:
  title: Lleva la analítica al punto de decisión
  text: Empieza por un diagnóstico y descubre qué decisiones ganan más con mejores datos.
  button: Solicita un diagnóstico
