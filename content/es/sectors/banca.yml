name: Banca
benefit: Riesgo, fraude y cliente con datos trazables e IA bajo control.
seo:
  title: Datos e IA para banca
  description: Riesgo de crédito, agregación de datos de riesgo (BCBS 239), fraude y AML, hiperpersonalización y copilotos, con DORA y el AI Act en mente.
header:
  eyebrow: Sector · Banca
  title: Datos e IA para banca
  intro: Riesgo, fraude y regulación exigen datos agregados, trazables y disponibles al momento. Ayudamos a que la IA pase de la prueba de concepto a producción sin perder el control.
challenges:
  title: Retos del sector
  items:
    - name: Exigencia supervisora
      text: Datos de riesgo agregados, conciliados y trazables hasta el origen.
    - name: Fraude en tiempo real
      text: Pagos instantáneos y nuevos patrones de fraude que cambian cada semana.
    - name: Cliente digital
      text: Personalización relevante sin comprometer la privacidad.
    - name: Eficiencia operativa
      text: Procesos documentales y de back-office todavía muy manuales.
domains:
  title: Casos de uso por área de negocio
  intro: Cada caso de uso indica qué pilares de servicio intervienen.
  items:
    - name: Riesgo y regulatorio
      useCases:
        - name: Riesgo de crédito y scoring
          text: Modelos explicables y documentados, listos para validación interna.
          pillars: [intelligence, ai]
        - name: Agregación de datos de riesgo y reporting
          text: Datos de riesgo gobernados, conciliados y trazables para el reporting regulatorio.
          pillars: [strategy, data]
    - name: Fraude y AML
      useCases:
        - name: Detección de fraude en transacciones
          text: Puntuación de operaciones en tiempo casi real, con menos falsos positivos.
          pillars: [intelligence, ai]
        - name: Prevención del blanqueo (AML)
          text: Monitorización de clientes y operaciones con priorización de alertas.
          pillars: [data, ai]
    - name: Cliente
      useCases:
        - name: Hiperpersonalización
          text: Ofertas y mensajes según el momento vital y financiero de cada cliente.
          pillars: [intelligence, ai]
        - name: Predicción de abandono
          text: Detectar a tiempo la pérdida de vinculación.
          pillars: [intelligence]
    - name: Operaciones
      useCases:
        - name: Copilotos para gestores y back-office
          text: Asistentes que preparan, resumen y documentan, con supervisión humana.
          pillars: [ai]
        - name: Automatización documental
          text: Lectura y validación de documentación en altas, préstamos y reclamaciones.
          pillars: [ai]
regulation:
  title: Contexto regulatorio
  intro: Diseñamos con la regulación en mente desde el principio, no como un añadido final.
  items:
    - name: BCBS 239
      text: Principios de agregación de datos de riesgo y presentación de informes. Gobierno, arquitectura y calidad del dato de riesgo.
    - name: DORA
      text: Resiliencia operativa digital, aplicable desde enero de 2025. Riesgo TIC y gestión de proveedores, incluidos los servicios cloud.
    - name: AI Act
      text: La evaluación de la solvencia de personas físicas es un uso de alto riesgo. Exige gestión de riesgos, documentación y supervisión humana.
    - name: GDPR
      text: Base legal, minimización y derechos de los interesados en cada uso de los datos.
faq:
  - q: ¿Es compatible el cloud con DORA?
    a: Sí. DORA no prohíbe el cloud. Exige gestionar el riesgo de los proveedores TIC con contratos adecuados, planes de salida y pruebas de resiliencia, y diseñamos las plataformas para cumplirlo.
  - q: ¿Un modelo de scoring es de alto riesgo según el AI Act?
    a: Sí, cuando evalúa la solvencia de personas físicas (la detección de fraude queda fuera). Implica gestión de riesgos, calidad de datos, documentación y supervisión humana.
