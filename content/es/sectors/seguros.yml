  intro: Tarificar mejor y resolver siniestros más rápido, con cada decisión justificada ante el cliente, el actuario y el supervisor.
challenges:
  title: Retos del sector
  items:
    - name: Tarificación competitiva
      text: Precios ajustados al riesgo en mercados cada vez más comparables.
    - name: Siniestros documentales
      text: Partes, informes y facturas que se revisan a mano.
    - name: Fraude
      text: Patrones que solo se ven al cruzar siniestros, pólizas y proveedores.
    - name: Reporting regulatorio
      text: Solvencia II e IFRS 17 exigen datos granulares, conciliados y auditables.
domains:
  title: Casos de uso por área de negocio
  intro: Cada caso de uso indica qué servicios intervienen. Entra en cada uno para ver cómo lo hacemos.
  items:
    - name: Tarificación
      useCases:
        - name: Pricing y tarificación
          text: Modelos de riesgo y de demanda construidos junto al equipo actuarial.
          services: [predictive-models, advanced-analytics]
    - name: Siniestros
      useCases:
        - name: Automatización de siniestros
          text: Lectura y extracción de documentos para acelerar la apertura y la liquidación.
          services: [process-automation, ai-agents]
        - name: Triaje y estimación de costes
          text: Priorizar los expedientes y anticipar su coste desde el primer aviso.
          services: [predictive-models, decision-intelligence]
    - name: Fraude
      useCases:
        - name: Detección de fraude en siniestros
          text: Señales de alerta y redes de relación entre siniestros, asegurados y proveedores.
          services: [predictive-models, advanced-analytics]
    - name: Cartera
      useCases:
        - name: Retención y venta cruzada
          text: Anticipar las bajas y detectar necesidades de cobertura.
          services: [decision-intelligence, predictive-models]
    - name: Regulatorio
      useCases:
        - name: Datos para Solvencia II e IFRS 17
          text: Un dato gobernado y trazable desde la póliza hasta el informe.
          services: [data-engineering-quality, data-ai-governance]
regulation:
  title: Contexto regulatorio
  intro: Diseñamos con la regulación en mente desde el principio, no como un añadido final.
  items:
    - name: Solvencia II
      text: Régimen prudencial del seguro en la UE. Calidad, trazabilidad y gobierno del dato que alimenta el cálculo y el reporting.
    - name: IFRS 17
      text: Norma contable de contratos de seguro, en vigor desde 2023. Datos granulares por cohorte y contrato.
    - name: DORA
      text: Resiliencia operativa digital también para aseguradoras. Riesgo TIC y gestión de proveedores cloud.
    - name: AI Act
      text: La evaluación de riesgos y la tarificación en seguros de vida y salud son usos de alto riesgo.
cta:
  title: Habla con nuestro equipo de Seguros
  text: Cuéntanos tu reto y te propondremos por dónde empezar.
  button: Habla con el equipo de Seguros
