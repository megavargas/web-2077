story:
  title: Our story
  paragraphs:
    - Contextual was founded in Madrid in 2016 as a business intelligence and data consultancy. Since then we have worked with telecoms operators, financial institutions and other large organisations to build their data and analytics platforms.
    - Today we bring consulting, data, intelligence and AI together in a single journey, focused on regulated industries, where context is everything.
