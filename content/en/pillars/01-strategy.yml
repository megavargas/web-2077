problem:
  title: The problem
  text: AI pilots that do not scale, half-built platforms and a list of initiatives competing for the same budget. What is missing is a shared way to decide what to do first and how to measure it.
includes:
  title: What it includes
outcome:
  title: Outcome
  text: A prioritised roadmap, with a business case per initiative and a governance model the board can approve.
technologies: []
faq:
  - q: Do we need our data in order before we start?
    a: No. The assessment starts from where you are today, and its purpose is precisely to decide what needs sorting out first.
  - q: How do you take the AI Act into account?
    a: We classify the risk of each use case and define governance requirements at design stage, so they do not surface at the end as a blocker.
