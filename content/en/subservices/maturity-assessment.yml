faq:
  - q: How is this different from the 2–4 week assessment?
    a: The 2–4 week assessment is the quick starting point and includes a maturity reading to prioritise use cases. The maturity assessment goes deeper with technical evidence and leaves a formal baseline, useful for a data master plan, an internal audit or a conversation with your supervisor.
  - q: Will you benchmark us against other companies in our sector?
    a: We do not produce rankings against competitors without data to back them up. We compare your position with what your objectives and your sector's regulation require, which is what you need to make decisions.
  - q: How much time does it take from our teams?
    a: A few interviews and workshops with business, data and technology leads, plus read access to documentation and the platform. Any access to data is agreed with your security teams beforehand.
cta:
  title: Need a reliable picture of where you stand?
  text: Start with a 2–4 week assessment, then decide whether you need a full maturity assessment with a formal baseline.
  button: Request an assessment
