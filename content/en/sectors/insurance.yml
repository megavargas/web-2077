challenges:
  title: Industry challenges
  items:
    - name: Competitive pricing
      text: Risk-adjusted prices in increasingly comparable markets.
    - name: Document-heavy claims
      text: Claim forms, reports and invoices reviewed by hand.
    - name: Fraud
      text: Patterns that only appear when claims, policies and suppliers are combined.
    - name: Regulatory reporting
      text: Solvency II and IFRS 17 require granular, reconciled and auditable data.
