regulation:
  title: Regulatory context
  intro: We design with regulation in mind from the start, not as an afterthought.
  items:
    - name: Solvency II
      text: The EU prudential regime for insurance. Quality, traceability and governance of the data behind calculation and reporting.
    - name: IFRS 17
      text: The accounting standard for insurance contracts, effective since 2023. Granular data by cohort and contract.
    - name: DORA
      text: Digital operational resilience for insurers too. ICT risk and management of cloud providers.
    - name: AI Act
      text: Risk assessment and pricing in life and health insurance are high-risk uses.
faq:
  - q: How do you work with the actuarial team?
    a: Pricing and reserving models are built with the actuarial team, which keeps ownership of the model and the technical judgement.
  - q: Is AI-based pricing high-risk under the AI Act?
    a: For life and health insurance, yes. It requires risk management, data quality, documentation and human oversight, and we account for it at design stage.
